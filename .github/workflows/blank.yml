name: 5-Hour YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start 5-Hour Stream Pipeline
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY || secrets.STREAM_KEY }}
        run: |
          KEY=$(echo -n "$STREAM_KEY" | tr -d '\r\n[:space:]"')
          if [ -z "$KEY" ]; then
            echo "::error::Stream Key missing hai!"
            exit 1
          fi

          echo "Preparing clean audio..."
          ffmpeg -y -i kohli.m4a -c:a pcm_s16le -ar 44100 -ac 2 audio_temp.wav

          echo "Starting Stream to YouTube (6000k Bitrate for 1080p)..."
          ffmpeg -re \
            -stream_loop -1 -i image.jpg \
            -stream_loop -1 -i audio_temp.wav \
            -t 05:00:00 \
            -map 0:v:0 -map 1:a:0 \
            -vf "scale=1920:1080,format=yuv420p" \
            -c:v libx264 -preset veryfast -b:v 6000k -maxrate 6800k -bufsize 12000k \
            -g 60 -keyint_min 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY"
