name: 5-Hour YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start 5-Hour Stream Pipeline
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY || secrets.STREAM_KEY }}
        run: |
          # 1. Check Stream Key
          KEY=$(echo -n "$STREAM_KEY" | tr -d '\r\n[:space:]"')
          if [ -z "$KEY" ]; then
            echo "ERROR: Stream key secret empty hai! GitHub Settings -> Secrets me YOUTUBE_STREAM_KEY check karein."
            exit 1
          fi

          # 2. Convert M4A to clean PCM Audio first to prevent SIGFPE (Exit Code 8)
          echo "Preparing audio track..."
          ffmpeg -y -i kohli.m4a -c:a pcm_s16le -ar 44100 -ac 2 audio_temp.wav

          echo "Starting YouTube Live Stream..."

          # 3. Stream to YouTube
          ffmpeg -re \
            -loop 1 -framerate 30 -i image.jpg \
            -stream_loop -1 -i audio_temp.wav \
            -t 05:00:00 \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
            -g 60 -keyint_min 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY"
