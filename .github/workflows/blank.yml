name: 5-Hour YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify Media Files
        run: |
          if [ ! -f "image.jpg" ]; then
            echo "::error::image.jpg root directory me nahi mili!"
            exit 1
          fi
          if [ ! -f "kohli.m4a" ]; then
            echo "::error::kohli.m4a root directory me nahi mili!"
            exit 1
          fi
          echo "Dono files exist karti hain."

      - name: Start 5-Hour Stream Pipeline
        env:
          RAW_KEY_1: ${{ secrets.YOUTUBE_STREAM_KEY }}
          RAW_KEY_2: ${{ secrets.STREAM_KEY }}
        run: |
          INPUT_KEY="${RAW_KEY_1:-$RAW_KEY_2}"
          STREAM_KEY=$(echo -n "$INPUT_KEY" | tr -d '\r\n[:space:]"')

          if [ -z "$STREAM_KEY" ]; then
            echo "::error::Stream Key missing hai! Repo secrets check karein."
            exit 1
          fi

          echo "Starting 5-Hour Stream Pipeline..."

          ffmpeg -re \
            -loop 1 -framerate 30 -i image.jpg \
            -stream_loop -1 -i kohli.m4a \
            -t 05:00:00 \
            -c:v libx264 -preset veryfast -tune stillimage \
            -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -af "aresample=async=1" \
            -shortest \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
