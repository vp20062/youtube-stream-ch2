name: 5-Hour YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify Files
        run: |
          echo "=== Checking Directory Content ==="
          ls -lh image.jpg kohli.m4a
          ffprobe -v error -show_entries format=duration,size image.jpg || echo "Image probe error"
          ffprobe -v error -show_entries format=duration,size kohli.m4a || echo "Audio probe error"

      - name: Start 5-Hour Stream Pipeline
        env:
          RAW_KEY_1: ${{ secrets.YOUTUBE_STREAM_KEY }}
          RAW_KEY_2: ${{ secrets.STREAM_KEY }}
        run: |
          INPUT_KEY="${RAW_KEY_1:-$RAW_KEY_2}"
          STREAM_KEY=$(echo -n "$INPUT_KEY" | tr -d '\r\n[:space:]"')

          if [ -z "$STREAM_KEY" ]; then
            echo "::error::Stream Key missing hai!"
            exit 1
          fi

          echo "Starting stream pipeline..."

          ffmpeg -re \
            -loop 1 -framerate 30 -i image.jpg \
            -stream_loop -1 -i kohli.m4a \
            -t 05:00:00 \
            -map 0:v:0 -map 1:a:0 \
            -vf "scale=1920:1080,format=yuv420p" \
            -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -g 60 -keyint_min 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
